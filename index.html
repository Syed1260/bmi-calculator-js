<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Body Mass Index (BMI) Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="heading">
        <h2>Body Mass Index (BMI) Calculator</h2>
        </div>
        <div class="input">
        <p>Your Height (cm):</p>
        <input type="number" placeholder="Enter Your Height" id="height" >
        <p>Your Weight (Kg):</p>
        <input type="number" placeholder="Enter your weight" id="weight" >
        </div>
        <div class="btn">
        <button>Compute BMI</button>
        </div>
        <p id="a">Your BMI : </p>
         <input type="number" placeholder="i.e 32.432544 is your BMI" id="bmi" >
        <h3>Weight CONDITION: </h3>


<script src="app.js"></script>
    </div>
</body>
</html>
